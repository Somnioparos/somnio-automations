<!DOCTYPE html>
<html lang="el">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#202D5D">
<style>
  :root { --navy:#202D5D; --bg:#F5F4F0; --card:#FFFFFF; --ink:#1E2230; --mute:#6B7080; --line:#E6E3DC;
          --red:#C0392B; --red-bg:#FBEDED; --orange:#C76A12; --orange-bg:#FDF1E3; --yellow:#9A7B00; --yellow-bg:#FFF8D9;
          --green:#2F7A4A; --green-bg:#E5F3EA; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--navy); color:#fff; padding:16px 16px 0; position:sticky; top:0; z-index:5; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  .upd { font-size:12px; opacity:.75; margin-top:2px; }
  button.refresh { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.refresh:disabled { opacity:.5; }
  .chips { display:flex; gap:8px; margin:12px 0 0; }
  .chip { flex:1; text-align:center; border-radius:10px 10px 0 0; padding:8px 4px; font-weight:600; font-size:14px; background:rgba(255,255,255,.08); cursor:pointer; }
  .chip.on { background:var(--bg); color:var(--navy); }
  main { padding:12px 12px 40px; max-width:820px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--mute); margin:0 0 10px; }
  .counts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .count { border-radius:12px; padding:10px; text-align:center; }
  .count b { display:block; font-size:24px; }
  .count span { font-size:12px; }
  .r { background:var(--red-bg); color:var(--red); } .o { background:var(--orange-bg); color:var(--orange); }
  .y { background:var(--yellow-bg); color:var(--yellow); } .g { background:var(--green-bg); color:var(--green); }
  .alert { padding:9px 10px; border-radius:10px; margin-bottom:6px; font-size:14px; }
  .move { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .move:last-child { border-bottom:0; }
  .tag { font-size:11px; font-weight:700; border-radius:6px; padding:3px 6px; white-space:nowrap; align-self:flex-start; }
  .in { background:var(--green-bg); color:var(--green); } .out { background:#ECEEF5; color:var(--navy); }
  .move .t { flex:1; } .move .s { font-size:12px; color:var(--mute); }
  .money { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; }
  .money:last-child { border-bottom:0; }
  .money .v { font-weight:700; white-space:nowrap; } .money .s { font-size:12px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 3px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--mute); font-weight:600; font-size:12px; }
  tr.now td { background:var(--yellow-bg); } tr.tot td { font-weight:700; border-top:2px solid var(--line); }
  .scroll { overflow-x:auto; }
  .issue { display:block; text-decoration:none; color:inherit; padding:10px; border-radius:10px; margin-bottom:6px; background:var(--card); border-left:4px solid var(--line); }
  .issue.lr { border-left-color:var(--red); } .issue.lo { border-left-color:var(--orange); } .issue.ly { border-left-color:#E0C341; }
  .issue .h { font-size:12px; color:var(--mute); } .issue .x { margin-top:2px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .f { border:1px solid var(--line); background:#fff; border-radius:16px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .f.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .hrow { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .hrow:last-child { border-bottom:0; } .hrow .s { font-size:12px; color:var(--mute); }
  .files { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .files a { display:block; text-align:center; padding:12px 6px; border-radius:10px; background:#ECEEF5; color:var(--navy); text-decoration:none; font-weight:600; font-size:14px; }
  .empty { color:var(--mute); font-size:14px; padding:4px 0; }
  .loading { text-align:center; color:var(--mute); padding:60px 0; }
  .err { background:var(--red-bg); color:var(--red); padding:12px; border-radius:10px; margin-bottom:12px; }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Somnio Control</h1><div class="upd" id="upd">φόρτωση…</div></div>
    <button class="refresh" id="btn" onclick="refresh()">↻ Ενημέρωση</button>
  </div>
  <div class="chips">
    <div class="chip on" data-v="today" onclick="tab(this)">Σήμερα</div>
    <div class="chip" data-v="issues" onclick="tab(this)">Εκκρεμότητες</div>
    <div class="chip" data-v="more" onclick="tab(this)">Επιδόσεις</div>
  </div>
</header>
<main>
  <div id="msg"></div>
  <div id="today"><div class="loading">Φόρτωση…</div></div>
  <div id="issues" class="hide"></div>
  <div id="more" class="hide"></div>
</main>
<script>
  var D = null, FILTER = 'all';
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function eur(n) { n = Number(n) || 0; var neg = n < 0; n = Math.abs(n); var p = n.toFixed(2).split('.');
    return (neg ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1] + ' €'; }
  function cls(sig) { return sig === '🔴' ? 'r' : sig === '🟠' ? 'o' : sig === '🟡' ? 'y' : 'g'; }
  function el(id) { return document.getElementById(id); }

  function tab(c) {
    document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === c); });
    ['today', 'issues', 'more'].forEach(function (v) { el(v).classList.toggle('hide', v !== c.dataset.v); });
    window.scrollTo(0, 0);
  }

  function render() {
    var d = D; el('upd').textContent = 'ενημέρωση ' + d.updated;
    // ---- Σήμερα
    var h = '';
    h += '<div class="card"><div class="counts">' +
      '<div class="count ' + (d.red ? 'r' : 'g') + '"><b>' + d.red + '</b><span>επείγοντα</span></div>' +
      '<div class="count ' + (d.orange ? 'o' : 'g') + '"><b>' + d.orange + '</b><span>σημαντικά</span></div>' +
      '<div class="count ' + (d.yellow ? 'y' : 'g') + '"><b>' + d.yellow + '</b><span>υπόλοιπα</span></div></div></div>';
    h += '<div class="card"><h2>Χρειάζεται προσοχή</h2>';
    if (!d.alerts.length) h += '<div class="alert g">🟢 Όλα καλά — καμία εκκρεμότητα.</div>';
    d.alerts.forEach(function (a) { h += '<div class="alert ' + cls(a.slice(0, 2)) + '">' + esc(a) + '</div>'; });
    h += '</div>';
    h += '<div class="card"><h2>Σήμερα & αύριο</h2>';
    if (!d.moves.length) h += '<div class="empty">Καμία άφιξη ή αναχώρηση σήμερα / αύριο.</div>';
    d.moves.forEach(function (m) {
      var arr = m[1] === 'Άφιξη';
      h += '<div class="move"><span class="tag ' + (arr ? 'in' : 'out') + '">' + esc(m[0]) + ' · ' + (arr ? 'άφιξη' : 'αναχώρηση') + '</span>' +
        '<div class="t"><b>' + esc(m[2]) + '</b> — ' + esc(m[3]) + '<div class="s">' + esc(m[5]) + (m[4] ? ' · ' + esc(m[4]) + ' άτομα' : '') +
        (arr ? ' · διαβατήριο ' + esc(m[6]) : '') + '</div></div></div>';
    });
    h += '</div>';
    h += '<div class="card"><h2>Χρήματα</h2>';
    d.money.forEach(function (m, i) {
      var isCount = i === d.money.length - 1;
      h += '<a class="money" href="' + esc(m[3] || '#') + '" target="_blank"><div>' + esc(m[0]) + (m[2] ? '<div class="s">' + esc(m[2]) + '</div>' : '') +
        '</div><div class="v">' + (isCount ? esc(m[1]) : eur(m[1])) + '</div></a>';
    });
    h += '</div>';
    h += '<div class="card"><h2>Αρχεία</h2><div class="files">';
    d.files.forEach(function (f) { if (f[1]) h += '<a href="' + esc(f[1]) + '" target="_blank">' + esc(f[0]) + '</a>'; });
    h += '</div></div>';
    el('today').innerHTML = h;

    // ---- Εκκρεμότητες
    var srcs = {}; d.issues.forEach(function (i) { srcs[i[1]] = 1; });
    var f = '<div class="filters"><span class="f' + (FILTER === 'all' ? ' on' : '') + '" onclick="flt(\'all\')">Όλες (' + d.issues.length + ')</span>' +
      ['🔴', '🟠', '🟡'].map(function (s) { var n = d.issues.filter(function (i) { return i[0] === s; }).length;
        return n ? '<span class="f' + (FILTER === s ? ' on' : '') + '" onclick="flt(\'' + s + '\')">' + s + ' ' + n + '</span>' : ''; }).join('') +
      Object.keys(srcs).map(function (s) { return '<span class="f' + (FILTER === s ? ' on' : '') + '" onclick="flt(\'' + esc(s) + '\')">' + esc(s) + '</span>'; }).join('') + '</div>';
    var list = d.issues.filter(function (i) { return FILTER === 'all' || i[0] === FILTER || i[1] === FILTER; });
    var L = list.map(function (i) {
      return '<a class="issue l' + cls(i[0]) + '" href="' + esc(i[5] || '#') + '" target="_blank"><div class="h">' + i[0] + ' ' + esc(i[1]) +
        (i[2] ? ' · ' + esc(i[2]) : '') + (i[3] ? ' · ' + esc(i[3]) : '') + '</div><div class="x">' + esc(i[4]) + '</div></a>';
    }).join('');
    el('issues').innerHTML = f + (L || '<div class="card empty">🟢 Καμία εκκρεμότητα.</div>');

    // ---- Επιδόσεις + υγεία
    var p = '<div class="card"><h2>Επιδόσεις ' + d.year + ' (μήνας check-in)</h2><div class="scroll"><table><tr><th></th><th>Κρατ.</th><th>Νύχτ.</th><th>Πληρ.</th><th>Τζίρος</th><th>Somnio</th></tr>';
    d.perf.forEach(function (r, i) {
      p += '<tr class="' + (i === 12 ? 'tot' : i === d.nowMonth ? 'now' : '') + '"><td>' + (i === 12 ? 'Σύνολο' : ['Ιαν','Φεβ','Μάρ','Απρ','Μάι','Ιούν','Ιούλ','Αύγ','Σεπ','Οκτ','Νοέ','Δεκ'][i]) + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' +
        (r[3] * 100).toFixed(1).replace('.', ',') + '%</td><td>' + eur(Math.round(r[4])).replace(',00 €', ' €') + '</td><td>' + eur(Math.round(r[5])).replace(',00 €', ' €') + '</td></tr>';
    });
    p += '</table></div><div class="empty" style="font-size:12px;margin-top:6px">Πληρότητα = νύχτες ÷ (' + d.activeProps + ' ενεργά ακίνητα × μέρες μήνα).</div></div>';
    p += '<div class="card"><h2>Υγεία αυτοματισμών</h2>';
    d.health.forEach(function (x) {
      p += '<div class="hrow"><span>' + x[0] + '</span><div style="flex:1"><b>' + esc(x[1]) + '</b><div class="s">' + [x[2], x[3], x[4]].filter(function (v) { return v; }).map(esc).join(' · ') + '</div></div></div>';
    });
    p += '</div>';
    el('more').innerHTML = p;
  }
  function flt(v) { FILTER = v; render(); }

  function fail(e) { el('btn').disabled = false; el('btn').textContent = '↻ Ενημέρωση';
    el('msg').innerHTML = '<div class="err">Σφάλμα: ' + esc(e && e.message || e) + '</div>'; }
  function load() {
    google.script.run.withSuccessHandler(function (d) { D = d; el('msg').innerHTML = ''; render(); }).withFailureHandler(fail).webData();
  }
  function refresh() {
    el('btn').disabled = true; el('btn').textContent = 'Ενημέρωση… (~20″)';
    google.script.run.withSuccessHandler(function (d) { D = d; el('btn').disabled = false; el('btn').textContent = '↻ Ενημέρωση'; el('msg').innerHTML = ''; render(); })
      .withFailureHandler(fail).webRefresh();
  }
  load();
</script>
</body>
</html>
